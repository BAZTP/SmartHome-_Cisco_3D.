services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smarthome}
      POSTGRES_USER: ${DB_USER:-smarthome}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    profiles: [local]
    image: smarthome-backend:local
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smarthome}
      DB_USER: ${DB_USER:-smarthome}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    profiles: [local]
    image: smarthome-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  postgres_data:
