server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /ws/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
 location /actuator/ { proxy_pass http://backend:8080; }
 location /v3/ { proxy_pass http://backend:8080; }
 location /swagger-ui/ { proxy_pass http://backend:8080; }
}
